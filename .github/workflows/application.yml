name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm run typecheck:api && pnpm run typecheck:e2e
      - run: pnpm run build
      - run: pnpm exec cap sync android
      - run: pnpm run test:run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:security-headers
      - run: pnpm run test:e2e
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset --local
      - run: supabase test db --local
      - if: always()
        run: supabase stop --no-backup
